# =============================================================
#  McooBuildwithEase —— Gradle 配置
#
#  【重要】本项目的版本坐标**只在本文件出现**。
#  跟随 Minecraft / Fabric 出新版本时，只改下面四处：
#      minecraft_version / loader_version / loom_version / fabric_api_version
#  其它文件一律不写死版本号。
#
#  ★ 编译版本必须与目标服务器一致：
#    服务器现用 Fabric Loader 0.19.3 + Fabric API 0.153.0+26.2。
#    用更新的 API 编译会引入服务器没有的类/方法，运行时 NoSuchMethodError。
# =============================================================

# ---------- Gradle 自身 ----------
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.daemon=true
# 不开 configuration-cache：Loom 与之有已知不兼容问题
# org.gradle.configuration-cache=true

# 本机出口 IP 被 Maven Central 403，下载资源（MC assets 等）也走本机代理
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890

# ---------- Minecraft / Fabric 坐标（唯一出处） ----------
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.18-SNAPSHOT
fabric_api_version=0.153.0+26.2

# ---------- 本 mod 自身的坐标 ----------
# 版本号规则：<年份>.<功能数>.<修复数>+<目标MC版本>
#   26      年份 = 目标 MC 的年份代（MC 跨年 26.x→27.x 才变）
#   0       本代 MC 上的新功能累计数：每加一个用户可见的新功能 +1
#   0       自上次功能 bump 以来的修复数：每修一个 BUG +1，功能 bump 时归零
#   +26.2   目标 MC 版本：服务器升 MC 就改这里（功能/修复计数不清零）
# 完整规则见 AGENTS.md「版本号规则」一节。
# 第一个版本 26.0.0+26.2。
mod_version=26.2.3+26.2
maven_group=com.mcoo
archives_base_name=McooBuildwithEase
