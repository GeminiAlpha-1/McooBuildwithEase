plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

loom {
	// 26.2 起 Loom 只在编译期应用「显式声明」的 access widener，
	// 仅在 fabric.mod.json 里写 accessWidener 字段是不够的。
	accessWidenerPath = file("src/main/resources/mcoo_build_with_ease.classtweaker")

	runs {
		client {
			// 开发客户端可以复用本机已下载的资源，避免重复下载几百 MB：
			//   gradlew runClient -PmcAssetsDir=C:/path/to/.minecraft/assets
			if (project.hasProperty('mcAssetsDir')) {
				programArgs '--assetsDir', project.property('mcAssetsDir')
			}
			// 自动连服（自测用）：
			//   gradlew runClient -PmcQuickPlay=127.0.0.1:25599
			if (project.hasProperty('mcQuickPlay')) {
				programArgs '--quickPlayMultiplayer', project.property('mcQuickPlay')
			}
			// 调试用：自动打开指定界面，便于无人值守截图核对 GUI
			//   gradlew runClient -PmcDebugScreen=settings
			if (project.hasProperty('mcDebugScreen')) {
				vmArgs "-Dmcoo.debugScreen=${project.property('mcDebugScreen')}"
			}
			// 调试用：打印 GUI 适配层的绘制调用（排查「画了但看不见」）
			//   gradlew runClient -PmcDebugGui=true
			if (project.hasProperty('mcDebugGui')) {
				vmArgs "-Dmcoo.debugGui=${project.property('mcDebugGui')}"
			}
			// 调试用：跑内置自检（-Dmcoo.selfTest=nbt 验证 NBT 数组标签的序列化）
			if (project.hasProperty('mcSelfTest')) {
				vmArgs "-Dmcoo.selfTest=${project.property('mcSelfTest')}"
			}
			// 调试用：打印预览渲染链路
			if (project.hasProperty('mcDebugPreview')) {
				vmArgs "-Dmcoo.debugPreview=true"
			}
		}
	}
}

repositories {
	// Loom 会自动补齐 Minecraft 与 Fabric 的仓库。
	// 额外挂一个国内 Central 镜像：本机出口 IP 被 Maven Central 403（Sonatype 反滥用），
	// 镜像作为 Central 的等价替代，避免依赖解析卡死。
	maven {
		name = 'Central Mirror'
		url = 'https://maven.aliyun.com/repository/public'
	}
	// ImGui 库（fabric-gui-imgui）只发在 Modrinth，用它的 Maven 仓库取编译期依赖。
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

configurations.all {
	resolutionStrategy {
		// Loom 的 dev 环境默认塞 mixinextras 0.5.4，而真实服务器（Fabric API 自带）是 0.5.5。
		// 0.5.4 的 FactoryRedirectWrapperMixinTransformer 与新版 ASM 不兼容：
		// 任何用了 @WrapFactory 的 mod（例：Axiom）在 dev 客户端都会崩在 mixin 变换阶段
		// （ClassCastException: ArrayList cannot be cast to AnnotationNode）。
		// 统一到 0.5.5 —— 只影响 dev 运行，生产环境由玩家的 Fabric API 提供。
		force 'io.github.llamalad7:mixinextras-fabric:0.5.5'
	}
}

// ------------------------------------------------------------------
// ImGui：把 fabric-gui-imgui 的内容并进我们的 jar（做法参照 Axiom）
//
//   * 它的类（cn/enaium/**，含 4 个 mixin）直接进我们的 jar
//   * 它自带的 META-INF/jars/*.jar（imgui-java 绑定 + 各平台 native）作为我们的 JiJ 条目
//   * 它的 4 个 mixin 合并进我们自己的 mixins 配置的 **client 段**
//     → 专用服务器是瘦服务端（jar 里没有 net.minecraft.client.* 类），
//       而 client 段的 mixin 服务端根本不加载 → 服务端零影响。
//       这正是 Axiom 用同一个包（environment: "*"）还能跑服务端的关键。
// ------------------------------------------------------------------
configurations {
	imguiBundle
}

dependencies {
	imguiBundle 'maven.modrinth:fabric-gui-imgui:26.2-1.2.0+imgui.1.92.7.1'
}

// 从 ImGui 库里抽出宿主类（cn/enaium/**，含 4 个 mixin）。
// ⚠️ 它的着色器资源（assets/fabric-gui-imgui/shaders/core/imgui.{vsh,fsh}）不在这里抽 ——
//    而是直接 vendor 进了 src/main/resources（dev 客户端只认那个目录，抽到 build/ 里取不到）。
// 用 Sync 而不是 Copy：Sync 会先清掉目标目录里的陈旧文件
// （否则上一版抽进去的 assets 会留在 build/ 里，和 src/main/resources 里的撞成重复条目）。
tasks.register('extractImguiClasses', Sync) {
	from zipTree(configurations.imguiBundle.singleFile)
	into "$buildDir/imgui/classes"
	include 'cn/enaium/**'
	// include/exclude 过滤器不算 Gradle 的任务输入 → 改了过滤条件它也不会重跑。强制每次重跑。
	outputs.upToDateWhen { false }
}

// ② 它自带的嵌套 jar（imgui-java 绑定 + LWJGL3 后端 + 各平台 native）先抽出来
tasks.register('extractImguiNested', Copy) {
	from zipTree(configurations.imguiBundle.singleFile)
	into "$buildDir/imgui/nested"
	include 'META-INF/jars/**'
	eachFile { details ->
		// imgui-java-binding-1.92.7.1.jar → imgui-java-binding.jar（版本升级不用改 fabric.mod.json）
		details.path = details.path.replaceFirst(/-[\d.]+\.jar$/, '.jar')
	}
}

// ③ 再把它们的**内容**解包进我们的 jar —— 不走 JiJ（做法参照 Axiom）：
//    native 直接放回原路径（io/imgui/java/native-bin/**），imgui-java 自己从 classpath 加载；
//    顺带去掉它们各自的 fabric.mod.json（它们是库，不是模组，别在模组列表里变成幽灵条目）。
tasks.register('extractImguiJava', Copy) {
	dependsOn 'extractImguiNested'
	from {
		fileTree("$buildDir/imgui/nested/META-INF/jars").files.collect { zipTree(it) }
	}
	into "$buildDir/imgui/java"
	exclude 'fabric.mod.json'
	exclude 'META-INF/**'
}

dependencies {
	// 【关键】26.2 起 Minecraft 不再混淆，直接对官方未混淆 jar 编译，
	// 因此没有 `mappings` 那一行 —— API 名称就是 Mojang 官方名。
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// 上游 common-api 的 ServiceLoader 机制依赖它生成 META-INF/services/
	annotationProcessor 'com.google.auto.service:auto-service:1.1.1'
	compileOnly 'com.google.auto.service:auto-service:1.1.1'

	// night-config：配置读写（common-api 的 Config / ConfigSpec 体系）
	// 上游用 shadow 插件把它重定位进 dev.huskuraft.universal.api.nightconfig，
	// 这里改为正常依赖 + 业务层 import 改回 com.electronwill.nightconfig，
	// 省掉一个插件依赖，效果等价。
	implementation 'com.electronwill.night-config:core:3.6.7'
	implementation 'com.electronwill.night-config:toml:3.6.7'
	implementation 'com.electronwill.night-config:json:3.6.7'
	include 'com.electronwill.night-config:core:3.6.7'
	include 'com.electronwill.night-config:toml:3.6.7'
	include 'com.electronwill.night-config:json:3.6.7'

	compileOnly 'io.netty:netty-all:4.1.109.Final'
	compileOnly 'org.slf4j:slf4j-api:2.0.13'
	compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

	// ------------------------------------------------------------------
	// ImGui（编译期依赖）
	//   fabric-gui-imgui  —— 26.2 的 ImGui 宿主（MIT），提供 ImGuiService 与渲染后端
	//   imgui-java-binding —— Dear ImGui 的 Java 绑定（MIT），提供 imgui.ImGui 控件 API
	// 编译期用 compileOnly；运行期的类由上面的 extractImgui* 任务打进我们的 jar。
	// ------------------------------------------------------------------
	compileOnly 'maven.modrinth:fabric-gui-imgui:26.2-1.2.0+imgui.1.92.7.1'
	compileOnly 'io.github.spair:imgui-java-binding:1.92.7.1'

	// dev 客户端走 classpath 而不是 jar，所以 ImGui 宿主类也要进开发期运行时
	runtimeOnly files("$buildDir/imgui/classes").builtBy('extractImguiClasses')

	// dev 客户端走 classpath 而不是 jar，所以 imgui-java 那几个 jar 也要进开发期运行时
	// （正式包里它们的内容已经解包进我们的 jar，native 在 io/imgui/java/native-bin/ 下）
	runtimeOnly 'io.github.spair:imgui-java-binding:1.92.7.1'
	runtimeOnly 'io.github.spair:imgui-java-lwjgl3:1.92.7.1'
	runtimeOnly 'io.github.spair:imgui-java-natives-windows:1.92.7.1'
	runtimeOnly 'io.github.spair:imgui-java-natives-linux:1.92.7.1'
	runtimeOnly 'io.github.spair:imgui-java-natives-macos:1.92.7.1'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// 把 ImGui 的宿主类与 imgui-java 运行时一起打进我们的 jar（单包，服务端客户端通用）
tasks.withType(Jar).configureEach {
	dependsOn 'extractImguiClasses', 'extractImguiJava'
	from("$buildDir/imgui/classes")
	from("$buildDir/imgui/java")
}

// 许可证随 jar 一起分发：LGPL v3 要求分发时附带许可证副本，
// 仓库根目录的 LICENSE / COPYING / NOTICE 原样打进 jar 的 META-INF/。
// 注意 into 必须写在 from 的闭包里 —— 写在任务层级会连 manifest 一起挪走，
// 报 "Zip file does not contain entry (META-INF/MANIFEST.MF)"。
tasks.withType(Jar).configureEach {
	into("META-INF") {
		from(rootProject.file("LICENSE"))
		from(rootProject.file("COPYING"))
		from(rootProject.file("NOTICE"))
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 26.2 要求 Java 25
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
